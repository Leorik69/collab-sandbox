name: Island 005 binary assets
on:
  push:
    branches: ['cursor/island-assets-portable-2beb']
    paths: ['.github/workflows/island-005-assets.yml']
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/island-assets-portable-2beb
      - name: Generate PNG assets
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          cat > /tmp/gen_assets.py <<'PY'
          from PIL import Image, ImageDraw
          import os

          def png(path, draw_fn, size=64):
              img = Image.new("RGBA", (size, size), (0,0,0,0))
              d = ImageDraw.Draw(img)
              draw_fn(d, size)
              img.save(path)

          def sun(d,s):
              c=s//2; r=s*0.22
              d.ellipse([c-r,c-r,c+r,c+r], fill=(255,200,60,255))
              import math
              for i in range(8):
                  a=math.pi*i/4
                  x1=c+math.cos(a)*s*0.32; y1=c+math.sin(a)*s*0.32
                  x2=c+math.cos(a)*s*0.44; y2=c+math.sin(a)*s*0.44
                  d.line([x1,y1,x2,y2], fill=(255,200,60,255), width=max(2,s//16))
          def cloud(d,s,fill=(200,210,225,255)):
              d.ellipse([s*0.12,s*0.38,s*0.5,s*0.72], fill=fill)
              d.ellipse([s*0.35,s*0.25,s*0.68,s*0.62], fill=fill)
              d.ellipse([s*0.55,s*0.4,s*0.9,s*0.72], fill=fill)
              d.rectangle([s*0.15,s*0.55,s*0.87,s*0.72], fill=fill)
          def rain(d,s):
              cloud(d,s)
              for x in (0.3,0.5,0.7):
                  d.line([s*x,s*0.74,s*x-s*0.06,s*0.9], fill=(90,160,255,255), width=max(2,s//16))
          def snow(d,s):
              cloud(d,s)
              for x,y in [(0.3,0.8),(0.5,0.85),(0.7,0.8)]:
                  r=s*0.035
                  d.ellipse([s*x-r,s*y-r,s*x+r,s*y+r], fill=(255,255,255,255))
          def storm(d,s):
              cloud(d,s,fill=(150,160,180,255))
              d.polygon([(s*0.55,s*0.6),(s*0.4,s*0.85),(s*0.52,s*0.85),(s*0.42,s*1.0),(s*0.65,s*0.78),(s*0.52,s*0.78)], fill=(255,210,60,255))
          def fog(d,s):
              cloud(d,s,fill=(180,190,205,230))
              for y in (0.78,0.87):
                  d.line([s*0.2,s*y,s*0.8,s*y], fill=(220,230,240,255), width=max(2,s//20))
          def bell_unread(d,s):
              d.ellipse([s*0.42,s*0.12,s*0.58,s*0.28], fill=(200,200,210,255))
              d.polygon([(s*0.42,s*0.28),(s*0.30,s*0.62),(s*0.70,s*0.62),(s*0.58,s*0.28)], fill=(230,230,240,255))
              d.ellipse([s*0.44,s*0.66,s*0.56,s*0.78], fill=(230,230,240,255))
              d.ellipse([s*0.62,s*0.18,s*0.9,s*0.46], fill=(10,132,255,255))
          def bell_none(d,s):
              d.ellipse([s*0.42,s*0.12,s*0.58,s*0.28], fill=(160,160,170,255))
              d.polygon([(s*0.42,s*0.28),(s*0.30,s*0.62),(s*0.70,s*0.62),(s*0.58,s*0.28)], fill=(180,180,190,255))
              d.ellipse([s*0.44,s*0.66,s*0.56,s*0.78], fill=(180,180,190,255))
          def dnd_active(d,s):
              d.ellipse([s*0.1,s*0.1,s*0.9,s*0.9], fill=(232,17,35,255))
              d.rectangle([s*0.28,s*0.44,s*0.72,s*0.56], fill=(255,255,255,255))
          def dnd_off(d,s):
              d.ellipse([s*0.1,s*0.1,s*0.9,s*0.9], outline=(170,170,180,255), width=max(2,s//14))
              d.rectangle([s*0.28,s*0.44,s*0.72,s*0.56], fill=(170,170,180,255))

          W="island/Assets/Weather"; S="island/Assets/Statuses"
          jobs={"sun.png":sun,"cloud.png":cloud,"rain.png":rain,"snow.png":snow,"storm.png":storm,"thunder.png":storm,"fog.png":fog}
          sj={"bell-unread.png":bell_unread,"bell-none.png":bell_none,"dnd-active.png":dnd_active,"dnd-off.png":dnd_off}
          os.makedirs(W, exist_ok=True); os.makedirs(S, exist_ok=True)
          for name,fn in jobs.items():
              png(f"{W}/{name}", fn, 64)
          for name,fn in sj.items():
              png(f"{S}/{name}", fn, 64)
          for folder in (W,S):
              for name in os.listdir(folder):
                  if name.endswith('.png'):
                      data=open(os.path.join(folder,name),'rb').read()
                      assert len(data)>100 and data[:8] == b'\x89PNG\r\n\x1a\n'
          print("wrote 11 real PNG assets")
          PY
          python3 /tmp/gen_assets.py
      - name: Commit PNG assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add island/Assets/Weather/*.png island/Assets/Statuses/*.png
          git commit -m '005: add real PNG assets'
          git push origin HEAD:cursor/island-assets-portable-2beb
